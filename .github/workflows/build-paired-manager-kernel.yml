name: Build PAIRED Manager and TEST-ONLY kebab kernel

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: kebab-paired-manager-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-paired-bundle:
    name: SukiSU Manager + LineageOS 23.2 / kebab / PAIRED TEST-ONLY
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CLANG_VERSION: clang-r563880c
      KERNEL_DIR: /tmp/kebab-kernel
      OUT_DIR: /tmp/kebab-out
      TOOLCHAIN_DIR: /tmp/kebab-clang
      SUKISU_MANAGER_DIR: /tmp/sukisu-manager
      LIBSU_DIR: /tmp/libsu-6.0.0

    steps:
      - name: Check out build configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Load immutable source locks
        shell: bash
        run: |
          set -a
          source build.lock
          source packaging/anykernel.lock
          set +a
          for name in \
            KERNEL_COMMIT \
            SUKISU_COMMIT \
            TOOLCHAIN_COMMIT \
            MANAGER_LIBSU_COMMIT \
            ANYKERNEL3_COMMIT; do
            value="${!name}"
            [[ "${value}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Invalid ${name}: ${value}" >&2
              exit 1
            }
            echo "${name}=${value}" >> "${GITHUB_ENV}"
          done

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install build, Android, and audit dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison build-essential ca-certificates device-tree-compiler \
            flex git libelf-dev libssl-dev lz4 openssl python3 rsync \
            shellcheck unzip zip zstd
          test -x "${ANDROID_SDK_ROOT}/build-tools/34.0.0/aapt2"
          test -x "${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner"
          test -x \
            "${ANDROID_SDK_ROOT}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/29.0.14206865" \
            >> "${GITHUB_ENV}"

      - name: Audit project scripts and packaging guardrails
        shell: bash
        run: |
          git diff --check
          bash -n scripts/*.sh
          sh -n packaging/anykernel.sh
          shellcheck scripts/*.sh
          grep -Fqx 'device.name1=kebab' packaging/anykernel.sh
          grep -Fqx 'supported.versions=16' packaging/anykernel.sh
          grep -Fqx 'IS_SLOT_DEVICE=1' packaging/anykernel.sh
          grep -Fqx 'SLOT_SELECT=active' packaging/anykernel.sh
          grep -Fqx 'PATCH_VBMETA_FLAG=0' packaging/anykernel.sh
          grep -Fqx 'NO_MAGISK_CHECK=1' packaging/anykernel.sh
          if grep -REiq \
            'SLOT_SELECT=inactive|PATCH_VBMETA_FLAG=(auto|1)|flash_generic[[:space:]]+dtbo|by-name/(dtbo|vbmeta)' \
            packaging scripts/package-anykernel.sh; then
            echo "Forbidden AnyKernel3 partition or verification behavior found" >&2
            exit 1
          fi

      - name: Build patched and ephemerally signed Manager
        shell: bash
        run: |
          mkdir -p dist
          set -o pipefail
          bash scripts/build-patched-manager.sh 2>&1 |
            tee dist/patched-manager-build.log

      - name: Verify paired Manager certificate handoff
        shell: bash
        run: |
          test -s "dist/${PATCHED_MANAGER_APK}"
          test -s dist/paired-manager.env
          grep -Fqx "KSU_EXPECTED_SIZE2=${KSU_EXPECTED_SIZE2}" \
            dist/paired-manager.env
          grep -Fqx "KSU_EXPECTED_HASH2=${KSU_EXPECTED_HASH2}" \
            dist/paired-manager.env

      - name: Fetch locked LineageOS kernel source
        shell: bash
        run: |
          git init "${KERNEL_DIR}"
          git -C "${KERNEL_DIR}" remote add origin \
            https://github.com/LineageOS/android_kernel_oneplus_sm8250.git
          git -C "${KERNEL_DIR}" fetch --depth=1 origin "${KERNEL_COMMIT}"
          git -C "${KERNEL_DIR}" checkout --detach FETCH_HEAD
          test "$(git -C "${KERNEL_DIR}" rev-parse HEAD)" = "${KERNEL_COMMIT}"

      - name: Fetch locked Android 16 Clang toolchain
        shell: bash
        run: |
          toolchain_repo="${RUNNER_TEMP}/clang-prebuilts"
          git init "${toolchain_repo}"
          git -C "${toolchain_repo}" remote add origin \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git -C "${toolchain_repo}" sparse-checkout init
          git -C "${toolchain_repo}" sparse-checkout set "${CLANG_VERSION}"
          git -C "${toolchain_repo}" fetch --depth=1 --filter=blob:none origin \
            "${TOOLCHAIN_COMMIT}"
          git -C "${toolchain_repo}" checkout --detach FETCH_HEAD
          test "$(git -C "${toolchain_repo}" rev-parse HEAD)" = \
            "${TOOLCHAIN_COMMIT}"
          mv "${toolchain_repo}/${CLANG_VERSION}" "${TOOLCHAIN_DIR}"
          "${TOOLCHAIN_DIR}/bin/clang" --version

      - name: Build kernel trusting the paired Manager
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-kernel.sh 2>&1 | tee dist/build.log

      - name: Build approved paired TEST-ONLY AnyKernel3 ZIP
        shell: bash
        env:
          ANYKERNEL3_PACKAGING_APPROVED: yes
        run: bash scripts/package-anykernel.sh

      - name: Verify paired TEST-ONLY bundle
        shell: bash
        run: |
          test -s "dist/${PATCHED_MANAGER_APK}"
          test -s "dist/${TEST_ZIP_NAME}"
          for file in \
            PATCHED_MANAGER_SHA256SUMS \
            patched-manager-build-info.txt \
            patched-manager-contents.txt \
            patched-manager-signature.txt \
            patched-manager-build.log \
            paired-manager.env \
            Image \
            kernel.config \
            build-info.txt \
            SHA256SUMS \
            kernel-final.diff \
            sukisu-final-complete.diff \
            applied-patches.txt \
            root-readiness.txt \
            build.log \
            static-audit.txt \
            TEST-ONLY-NOT-FOR-RELEASE.txt \
            DEVICE_TEST_PLAN.md \
            PAIRED_MANAGER_INSTALL.md \
            anykernel-zip-contents.txt; do
            test -s "dist/${file}"
          done
          (
            cd dist
            sha256sum -c PATCHED_MANAGER_SHA256SUMS
            sha256sum -c SHA256SUMS
            unzip -t "${TEST_ZIP_NAME}"
            sha256sum \
              "${PATCHED_MANAGER_APK}" \
              "${TEST_ZIP_NAME}" \
              > PAIRED_BUNDLE_SHA256SUMS
          )
          grep -Fqx \
            'manager_signature_mode=official_plus_paired_ephemeral' \
            dist/root-readiness.txt
          grep -Fqx \
            "paired_manager_certificate_size=${KSU_EXPECTED_SIZE2}" \
            dist/root-readiness.txt
          grep -Fqx \
            "paired_manager_certificate_sha256=${KSU_EXPECTED_HASH2}" \
            dist/root-readiness.txt
          grep -Fq \
            "KernelSU Manager signature size2: ${KSU_EXPECTED_SIZE2}" \
            dist/build.log
          grep -Fq \
            "KernelSU Manager signature hash2: ${KSU_EXPECTED_HASH2}" \
            dist/build.log
          if find dist -type f \
            \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.pk8' \) |
            grep -q .; then
            echo "Private signing material reached dist/" >&2
            exit 1
          fi

      - name: Upload paired owner TEST-ONLY artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kebab-sukisu-4.19-PAIRED-MANAGER-TEST-ONLY-${{ env.PROJECT_SHORT_SHA }}
          path: |
            dist/${{ env.PATCHED_MANAGER_APK }}
            dist/${{ env.TEST_ZIP_NAME }}
            dist/PAIRED_BUNDLE_SHA256SUMS
            dist/PATCHED_MANAGER_SHA256SUMS
            dist/patched-manager-build-info.txt
            dist/patched-manager-contents.txt
            dist/patched-manager-signature.txt
            dist/patched-manager-build.log
            dist/paired-manager.env
            dist/Image
            dist/kernel.config
            dist/build-info.txt
            dist/SHA256SUMS
            dist/kernel-final.diff
            dist/sukisu-final-complete.diff
            dist/applied-patches.txt
            dist/root-readiness.txt
            dist/build.log
            dist/static-audit.txt
            dist/TEST-ONLY-NOT-FOR-RELEASE.txt
            dist/DEVICE_TEST_PLAN.md
            dist/PAIRED_MANAGER_INSTALL.md
            dist/anykernel-zip-contents.txt
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
